name: 'Check pull request body, diff and files'
description: 'Checks that the body or the added code contains or avoid a word, number of files or lines changed'
author: 'EugenMayer'

branding:
  icon: 'git-pull-request'
  color: 'gray-dark'
inputs:
  github-token:
    description: 'Github token, added magically'
  bodyContains:
    description:
      'String or |-separated array of strings, one of which must be contained in the PR body, can be left blank or
      omitted'
  bodyDoesNotContain:
    description: 'String or |-separated array of strings, none of which should be in the PR body, can be left blank'
  diffContains:
    description: 'Word that must be contained in the added code'
  diffDoesNotContain:
    description: 'Word that should not be contained in the added code'
  diffFilesToExclude:
    description:
      'Files to exclude from being checked. Use a multiline string, each line should be one filepath or glob (e.g.
      **/*.md) relative to the repository root'
  diffFilesToInclude:
    description:
      'Only check these files, all others are skipped. Use a multiline string, each line should be one filepath or glob
      (e.g. **/*.kt) relative to the repository root. Defaults to all files'
  diffIgnoreComments:
    description:
      'Ignore C-style comments (//, /* and lines starting with *) in the added code when checking diffContains and
      diffDoesNotContain'
    default: 'false'
  linesChanged:
    description: 'Max number of lines changed per PR'
  filesChanged:
    description: 'Max number of files changed in the PR'
  waivedUsers:
    description: 'Users that will not need to follow these guidelines. Defaults to dependabot.'
outputs:
  diff:
    description: 'Added lines violating diffDoesNotContain, newline separated'

runs:
  using: node20
  main: dist/index.js
